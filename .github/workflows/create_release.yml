name: Create a Release

on:
  push:
    branches:
      - main
  release:
    types: [create]

env:
  VERSION: ${{ github.run_number }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v ./...

  release:
    name: New Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all commits 

      - name: Download and install git-cliff
        run: |
          curl -L "https://github.com/orhun/git-cliff/releases/download/v2.2.1/git-cliff-2.2.1-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
          tar -xzf git-cliff.tar.gz
          mv git-ckiff-2.2.1/git-cliff /usr/local/bin/

      - name: Generate CHANGELOG
        run: git-cliff --config cliff.toml --output CHANGELOG.md

      - name: Commit CHANGELOG 
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md
          git commit -m "feat(CHANGELOG): added new commits in CHANGELOG"
          git push origin https://github.com/${{ github.repository }}.git HEAD:main
      
